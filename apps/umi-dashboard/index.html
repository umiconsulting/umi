<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Let native controls (scrollbars, selects, date pickers) match the theme. -->
    <meta name="color-scheme" content="light dark" />
    <title>Umi · Dash — Owner Console</title>
    <!-- Set the theme BEFORE first paint so the first frame is never the wrong
         color. A stored value is a theme name (e.g. 'umi', 'midnight'); 'system'
         stores nothing, so the OS preference governs through @media
         (prefers-color-scheme) in @umi/tokens/dashboard.css. Kept inline and tiny
         on purpose — it must run before the stylesheet applies. The name pattern
         keeps it forward-compatible with new themes without editing this script.
         Mirrors the storage key in src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('umi-theme');
          if (t && /^[a-z][a-z0-9-]*$/.test(t))
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces is variable on optical size: `opsz` lets a 44px title and a 28px
         figure share the family without reading as one stamp scaled. `SOFT 0` and
         `WONK 0` keep it upright and sober — this is a register, not a magazine. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
