name: umi_pos
description: UmiPOS client application for the UMI platform.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  cryptography: 2.7.0
  crypto: 3.0.7
  http: 1.5.0
  shared_preferences: 2.5.3
  umi_contract:
    path: ../../packages/contract/generated/dart
  socket_io_client: 3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  fake_async: 1.3.3
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
