name: ${COMPOSE_PROJECT_NAME:-umipos-pilot}

x-api-environment: &api-environment
  NODE_ENV: production
  UMI_ENVIRONMENT: ${UMI_ENVIRONMENT}
  CONTRACT_VERSION: ${CONTRACT_VERSION}
  EXPECTED_SCHEMA_VERSION: ${EXPECTED_SCHEMA_VERSION}
  CONFIG_SCHEMA_VERSION: ${CONFIG_SCHEMA_VERSION}
  PILOT_BOOTSTRAP_TOKEN: ${PILOT_BOOTSTRAP_TOKEN}
  PILOT_BOOTSTRAP_EXPIRES_AT: ${PILOT_BOOTSTRAP_EXPIRES_AT}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
  DATABASE_TLS_MODE: ${DATABASE_TLS_MODE}
  OTEL_SERVICE_VERSION: ${RELEASE_VERSION}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${UMI_ENVIRONMENT},service.version=${RELEASE_VERSION}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      UMIPOS_DB_APP_PASSWORD: ${UMIPOS_DB_APP_PASSWORD}
      UMIPOS_DB_WORKER_PASSWORD: ${UMIPOS_DB_WORKER_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=100
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../:/workspace:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/00-umipos-pilot.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f /var/lib/postgresql/data/.umipos-init-complete && pg_isready -U postgres -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.30

  redis:
    image: redis:7.4.10-alpine3.21
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.31

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: [CMD, /otelcol-contrib, components]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.32

  migrate:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RELEASE_VERSION: ${RELEASE_VERSION}
      EXPECTED_SCHEMA_VERSION: ${EXPECTED_SCHEMA_VERSION}
    volumes:
      - ../../:/workspace:ro
      - ./migrate.sh:/pilot/migrate.sh:ro
      - pilot-state:/state
    entrypoint: [bash, /pilot/migrate.sh]
    networks:
      pilot-internal:

  umi-api:
    image: umipos-api:${RELEASE_VERSION}
    build:
      context: ../../
      dockerfile: apps/umi-api/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION}
        RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT}
        RELEASE_BUILD_TIMESTAMP: ${RELEASE_BUILD_TIMESTAMP}
    env_file: ${PILOT_ENV_FILE:-pilot.env}
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: umi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.20
      pilot-edge:

  umi-worker:
    image: umipos-api:${RELEASE_VERSION}
    command: [node, --require, '@opentelemetry/auto-instrumentations-node/register', dist/worker.js]
    env_file: ${PILOT_ENV_FILE:-pilot.env}
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: umi-worker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/umi-worker-ready && node -e
          "Promise.all([require('pg').Client,require('ioredis')]).then(async([Client,Redis])=>{const
          db=new Client({connectionString:process.env.DATABASE_URL_WORKER});const
          redis=new Redis(process.env.REDIS_URL,{maxRetriesPerRequest:1});await
          db.connect();await db.query('select 1');await redis.ping();await
          db.end();redis.disconnect()}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 9
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.21
      pilot-edge:

  umi-dashboard:
    image: umipos-dashboard:${RELEASE_VERSION}
    build:
      context: ../../
      dockerfile: apps/umi-dashboard/Dockerfile
      args:
        UMI_ENVIRONMENT: ${UMI_ENVIRONMENT}
        PUBLIC_URL: ${PUBLIC_DASHBOARD_URL}
        API_BASE: ''
        RELEASE_VERSION: ${RELEASE_VERSION}
        RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT}
        RELEASE_BUILD_TIMESTAMP: ${RELEASE_BUILD_TIMESTAMP}
        CONTRACT_VERSION: ${CONTRACT_VERSION}
        CONFIG_SCHEMA_VERSION: ${CONFIG_SCHEMA_VERSION}
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.22

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      PILOT_DOMAIN: ${PILOT_DOMAIN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      umi-api:
        condition: service_healthy
      umi-dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks:
      pilot-internal:
        ipv4_address: 172.31.64.10
      pilot-edge:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  pilot-state:

networks:
  pilot-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.64.0/24
  pilot-edge:
