# Include source aliases as well as declared workspace dependencies.
packages:
  - 'packages/tokens/**'
  - 'packages/contract/**'
  - 'apps/umi-api/src/modules/**/*.controller.ts'
  - '.github/workflows/packages-ci.yml'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
api:
  - 'apps/umi-api/**'
  - 'db/**'
  - 'deploy/staging/**'
  - 'packages/contract/**'
  - '.github/workflows/umi-api*.yml'
  - '.github/workflows/deploy-backend.yml'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'turbo.json'
  - '.npmrc'
dashboard:
  - 'apps/umi-dashboard/**'
  - 'packages/contract/**'
  - 'packages/tokens/**'
  - '.github/workflows/web-ci.yml'
  - '.github/workflows/deploy-dashboard.yml'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'turbo.json'
  - '.npmrc'
landing:
  - 'apps/umi-landing-page/**'
  - 'packages/tokens/**'
  - '.github/workflows/web-ci.yml'
  - '.github/workflows/deploy-landing.yml'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'turbo.json'
  - '.npmrc'
cash:
  - 'apps/umi-cash/**'
  - '.github/workflows/cash-ci.yml'
pos:
  - 'apps/umi-pos/**'
  - '.github/workflows/umi-pos-ios.yml'
pos_ios:
  - 'apps/umi-pos/ios/**'
offline_e2e:
  - 'scripts/ci-pos-api-offline-smoke.sh'
  - 'scripts/seed-offline-e2e-fixture.mjs'
  - '.github/workflows/offline-e2e.yml'
