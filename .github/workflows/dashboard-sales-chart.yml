name: Dashboard sales chart

on:
  pull_request:
    paths:
      - apps/umi-dashboard/src/screens/ventas-report.jsx
      - apps/umi-dashboard/src/styles.css
      - apps/umi-dashboard/e2e/sales-chart.pw.js
      - apps/umi-dashboard/playwright.config.js
      - .github/workflows/dashboard-sales-chart.yml
      - pnpm-lock.yaml
  push:
    branches: [main, staging]
    paths:
      - apps/umi-dashboard/src/screens/ventas-report.jsx
      - apps/umi-dashboard/src/styles.css
      - apps/umi-dashboard/e2e/sales-chart.pw.js
      - apps/umi-dashboard/playwright.config.js
      - .github/workflows/dashboard-sales-chart.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify hourly and daily bar heights
        working-directory: apps/umi-dashboard
        run: pnpm run test:browser e2e/sales-chart.pw.js --reporter=line
