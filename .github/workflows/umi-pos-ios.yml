name: umi-pos ios

# Validates the native POS client on Linux and compiles the iOS target on macOS
# only when native iOS files, pubspec dependencies, or release targets change.
on:
  workflow_call:
    inputs:
      build_ios:
        description: Compile the unsigned iOS Runner on macOS
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pos:
    name: test POS client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: apps/umi-pos
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/umi-pos
        run: flutter gen-l10n

      - name: Native POS client tests
        working-directory: apps/umi-pos
        run: |
          flutter test --no-pub \
            test/cart_test.dart \
            test/cart_optimism_test.dart \
            test/cart_command_queue_test.dart \
            test/offline_journal_test.dart \
            test/offline_policy_test.dart \
            test/recovery_orchestrator_test.dart \
            test/catalog_test.dart \
            test/checkout_test.dart \
            test/local_first_checkout_test.dart \
            test/checkout_point_tender_test.dart \
            test/sale_lifecycle_test.dart \
            test/cash_equation_test.dart \
            test/cash_restart_recovery_test.dart \
            test/cash_center_test.dart \
            test/incoming_orders_test.dart \
            test/operator_permissions_test.dart \
            test/features/tables/table_state_test.dart \
            test/features/tables/local_first_table_state_repository_test.dart \
            test/features/kitchen/

  build-ios:
    name: build the iOS target
    if: github.event_name == 'workflow_dispatch' || inputs.build_ios
    runs-on: macos-15
    timeout-minutes: 25
    env:
      UMIPOS_DEFINES: >-
        --dart-define=UMIPOS_ENVIRONMENT=development
        --dart-define=UMIPOS_API_BASE_URL=https://api-staging.umiconsulting.co
        --dart-define=UMIPOS_DEVELOPMENT_DIAGNOSTICS=true
        --dart-define=UMIPOS_FEATURE_BOOTSTRAP=disabled
        --dart-define=UMIPOS_HARDWARE_SIMULATOR_ENABLED=true
        --dart-define=UMIPOS_RELEASE_VERSION=0.1.0
        --dart-define=UMIPOS_CONFIG_SCHEMA_VERSION=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read the contract version
        run: |
          CONTRACT_VERSION=$(sed -n "s/^export const CONTRACT_VERSION = '\(.*\)';$/\1/p" packages/contract/src/catalog.ts)
          test -n "$CONTRACT_VERSION"
          printf 'CONTRACT_VERSION=%s\n' "$CONTRACT_VERSION" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Select the newest Xcode on the image
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Resolve packages
        working-directory: apps/umi-pos
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/umi-pos
        run: flutter gen-l10n

      - name: Build for iOS without signing
        working-directory: apps/umi-pos
        run: flutter build ios --no-codesign --release $UMIPOS_DEFINES --dart-define=UMIPOS_CONTRACT_VERSION="$CONTRACT_VERSION"
