name: Deploy API to staging
'on':
  workflow_call:
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_SSH_PORT:
        required: false
permissions:
  contents: read
  packages: write
jobs:
  # Run the same CI gate on the exact commit that this push deploys. The
  # deploy job cannot start until this call is green.
  validate:
    uses: ./.github/workflows/umi-api-ci.yml

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-backend.yml
    with:
      app_name: umi-api
      app_dir: apps/umi-api
      image: ghcr.io/umiconsulting/umi-api
      health_url: https://api-staging.umiconsulting.co/health
      # The commit that `validate` just tested. deploy.sh refuses to roll if
      # the branch tip no longer matches it.
      release_sha: ${{ github.sha }}
      release_url: https://api-staging.umiconsulting.co/health/release
      repo_dir: /home/juan/umi-staging
      branch: staging
      compose_file: deploy/staging/compose.yml
      project_dir: /home/juan/umi-api-test
      push_latest: false
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
concurrency:
  group: deploy-api-staging
  cancel-in-progress: false
