# Deploys `staging` to the VPS QA stack on every merge to `staging`. Thin caller of
# the reusable deploy-backend workflow — see .github/workflows/deploy-backend.yml.
#
# This is the non-production twin of umi-api-deploy.yml (which ships main to prod).
# It used to deploy `build-v3` — a branch that no longer exists, because the cutover
# of 2026-10-06 merged everything into main and the merged branches were deleted.
# Pointing this at `staging` is what turns the QA stack into the pre-production
# environment it was meant to be: the same code as main, one step behind it, with its
# own database, its own domain and its own secrets.
#
# It ships the same image prod does, built from this branch, into a separate
# compose project on the same host — see deploy/staging/compose.yml.
name: umi-api deploy (staging)

on:
  push:
    branches: [staging]
    paths:
      - 'apps/umi-api/**'
      - 'packages/contract/**'
      - 'deploy/staging/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/umi-api-deploy-staging.yml'
      - '.github/workflows/deploy-backend.yml'
  # The QA box is also the place to re-roll after fixing something on it, without
  # inventing a commit first.
  workflow_dispatch:

# Never run two staging deploys at once; let an in-flight one finish. Deliberately
# a different group from prod's, so a staging roll can never cancel a prod one.
concurrency:
  group: deploy-umi-api-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      app_name: umi-api
      app_dir: apps/umi-api
      package_name: '@umi/api'
      image: ghcr.io/umiconsulting/umi-api
      health_url: https://api-staging.umiconsulting.co/health
      # The staging checkout on the box. deploy.sh git-resets it to the branch before
      # rolling containers, so what runs always matches what CI built. The directory
      # was renamed with the branch — it was /home/juan/umi-buildv3, a name that
      # outlived the branch it referred to.
      repo_dir: /home/juan/umi-staging
      branch: staging
      # The QA stack's compose file now lives in the repo; its .env, certs and
      # secrets deliberately do not (gitignored state that must survive the
      # reset). UMI_PROJECT_DIR keeps them resolving where they have always been.
      compose_file: deploy/staging/compose.yml
      project_dir: /home/juan/umi-api-test
      # Never touch :latest — that tag is prod's human reference.
      push_latest: false
    secrets: inherit
