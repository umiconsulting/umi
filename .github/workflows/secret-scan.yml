name: secret scan

# Scans every commit in the repository for credentials.
#
# WHY THIS EXISTS. GitHub gives PUBLIC repositories secret scanning and push
# protection for free; PRIVATE repositories on the free plan get neither. This
# repository is going private — it carries the platform architecture, the
# build-v3 DDL and the security gate, and it should not be readable by strangers
# — but that removes the control which would BLOCK a credential at the moment of
# the push. This replaces it rather than losing it.
#
# It is not a hypothetical control. On 2026-08-07 the then-public
# umiconsulting/umi-cash was found holding
# `passes/apple/certificates/signerKey.pem` in HEAD: an unencrypted RSA private
# key, beside its certificate and the WWDR chain — a complete, working kit for
# signing Apple Wallet passes as Umi. Push protection is exactly what stops that
# at the push, instead of months later during an unrelated audit.
#
# WHY A SEPARATE WORKFLOW HERE. On `build-v3` this same scan is a STEP inside the
# `lint` job, because `lint` is a REQUIRED context there and a new job would add a
# context branch protection does not know about — an unenforced check. `main` has
# no `lint` workflow and no branch protection, so a standalone workflow is the
# simpler shape. Keep the two in step: if `lint.yml` arrives on `main` at cutover,
# fold this in and delete the file rather than running the scan twice.
#
# NO `paths:` FILTER. A secret can be added by any file in any commit; a filter
# would let exactly the unexpected path through.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Full history — the scan reads every commit, not just the tip. A secret
          # that was committed and then "removed" in a later commit is still in the
          # pack and still clonable; a depth-1 checkout would report the repository
          # clean while the credential sat one commit back.
          fetch-depth: 0

      # The binary is installed directly rather than through
      # gitleaks/gitleaks-action: that action requires a paid GITLEAKS_LICENSE for
      # repositories owned by an ORGANIZATION, and umiconsulting is one. The CLI is
      # the same scanner with no such condition.
      #
      # Pinned by version and verified against the published checksum — an
      # unpinned installer inside a security check is its own supply-chain hole.
      - name: Scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          # --log-opts="--all" scans every ref, so a secret on a side branch or in
          # rewritten history is caught too. --redact keeps the finding out of the
          # CI log, which is itself readable by anyone who can see the run.
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all"
