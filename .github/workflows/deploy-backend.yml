name: Deploy backend (reusable)
permissions:
  contents: read
  packages: write
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build & push image to GHCR
        env:
          IMAGE: ${{ inputs.image }}
          DIR: ${{ inputs.app_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Bake the immutable release identity into the image (config.schema.ts
          # requires all four in staging/pilot/production; /health/live reports them).
          # CONTRACT_VERSION's source of truth is packages/contract/src/catalog.ts.
          CONTRACT_VERSION="$(sed -n "s/^export const CONTRACT_VERSION = '\(.*\)';$/\1/p" packages/contract/src/catalog.ts)"
          test -n "$CONTRACT_VERSION" || { echo "CONTRACT_VERSION not found in packages/contract/src/catalog.ts"; exit 1; }
          TAGS=(-t "$IMAGE:sha-${{ github.sha }}")
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS+=(-t "$IMAGE:latest")
          fi
          docker build \
            --build-arg RELEASE_VERSION="$(git describe --tags --always)" \
            --build-arg RELEASE_GIT_COMMIT="${{ github.sha }}" \
            --build-arg RELEASE_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --build-arg CONTRACT_VERSION="$CONTRACT_VERSION" \
            "${TAGS[@]}" \
            -f "$DIR/Dockerfile" .
          docker push "$IMAGE:sha-${{ github.sha }}"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker push "$IMAGE:latest"
          fi
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          APP_NAME: ${{ inputs.app_name }}
          UMI_REPO_DIR: ${{ inputs.repo_dir }}
          UMI_DEPLOY_BRANCH: ${{ inputs.branch }}
          UMI_COMPOSE_FILE: ${{ inputs.compose_file }}
          UMI_PROJECT_DIR: ${{ inputs.project_dir }}
          DEPLOY_SCRIPT: ${{ inputs.app_dir }}/deploy/deploy.sh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Stream deploy.sh to a temp file on the box, then run it with stdin
          # detached (< /dev/null). Piping the script straight into `bash -s`
          # breaks: deploy.sh's own `git fetch` spawns an ssh-to-GitHub that
          # drains the very stdin the script is being read from, so bash hits
          # EOF mid-script and dies silently. cat-to-file + /dev/null avoids it.
          # UMI_REPO_DIR, when set, redirects deploy.sh at a second, isolated
          # checkout (e.g. a staging environment) instead of its $HOME/umi default.
          # UMI_COMPOSE_FILE/UMI_PROJECT_DIR likewise let that environment keep a
          # repo-tracked compose file apart from its state directory — see
          # deploy/staging/compose.yml and apps/umi-api/deploy/deploy.sh.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=15 -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cat > /tmp/$APP_NAME-deploy.sh && APP_NAME='$APP_NAME' UMI_REPO_DIR='$UMI_REPO_DIR' UMI_DEPLOY_BRANCH='$UMI_DEPLOY_BRANCH' UMI_COMPOSE_FILE='$UMI_COMPOSE_FILE' UMI_PROJECT_DIR='$UMI_PROJECT_DIR' bash /tmp/$APP_NAME-deploy.sh 'sha-${{ github.sha }}' < /dev/null" \
            < "$DEPLOY_SCRIPT"
      - name: Health check
        if: ${{ inputs.health_url != '' }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "${{ inputs.health_url }}" >/dev/null; then
              echo "Health OK: ${{ inputs.health_url }}"; exit 0
            fi
            echo "Waiting for health ($i/10)..."; sleep 6
          done
          echo "Health check failed: ${{ inputs.health_url }}"; exit 1
    timeout-minutes: 20
'on':
  workflow_call:
    inputs:
      app_name:
        description: Service name, also the apps/<app_name> dir on the VPS (e.g. umi-api)
        type: string
        required: true
      app_dir:
        description: Path to the app in this repo (e.g. apps/umi-api)
        type: string
        required: true
      image:
        description: GHCR image name without tag (e.g. ghcr.io/umiconsulting/umi-api)
        type: string
        required: true
      health_url:
        description: Optional URL to curl after deploy; empty disables the check
        type: string
        default: ''
      repo_dir:
        description:
          Repo checkout to deploy from on the VPS (passed through as UMI_REPO_DIR to deploy.sh). Empty uses deploy.sh's
          own default ($HOME/umi) — set this for a second, isolated environment (e.g. a staging checkout) on the same box.
        type: string
        default: ''
      branch:
        description: Branch label passed to deploy.sh. Deployment files use the image commit. Empty uses main.
        type: string
        default: ''
      push_latest:
        description:
          Also tag+push the image as ":latest". Prod relies on this as a human reference (the running tag is always
          pinned via .env, never :latest) — leave false for a non-prod caller so it can never shadow prod's tag.
        type: boolean
        default: true
      compose_file:
        description:
          Compose file to roll on the VPS (passed through as UMI_COMPOSE_FILE). Absolute, or relative to the deploy
          checkout. Empty uses deploy.sh's own default of apps/<app_name>/docker-compose.yml.
        type: string
        default: ''
      project_dir:
        description:
          "Compose project directory on the VPS (passed through as UMI_PROJECT_DIR): where `.env`, certs and secrets
          resolve, and where the default project name comes from. Empty uses the compose file's own directory. Set this for
          an environment whose compose file lives in the repo but whose state (gitignored .env/certs/secrets) lives elsewhere."
        type: string
        default: ''
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_SSH_PORT:
        required: false
