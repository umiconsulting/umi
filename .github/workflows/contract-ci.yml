name: Contract validation
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @umi/contract typecheck
      - name: Generated artifact drift
        run: pnpm --filter @umi/contract generate:check
      - name: Generated TypeScript SDK
        run: packages/contract/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext packages/contract/generated/typescript/umi_contract.ts
      - name: Generated Dart SDK
        run: docker run --rm -v "$PWD/packages/contract/generated/dart:/contract:ro" -w /contract dart@sha256:13140e26d84f4fda57cea31942222112aeb2eec10e5e6874c1c0f70beed189ab dart analyze --no-fatal-warnings lib/umi_contract.dart
      - name: Generated Dart optional field behavior
        run: docker run --rm -v "$PWD/packages/contract:/contract:ro" -w /contract dart@sha256:13140e26d84f4fda57cea31942222112aeb2eec10e5e6874c1c0f70beed189ab dart test/dart/optional_nullable_test.dart
      - name: Build (tsup dual CJS+ESM+dts)
        run: pnpm --filter @umi/contract build
      - name: Route-literal tests
        run: pnpm --filter @umi/contract test
    timeout-minutes: 15
