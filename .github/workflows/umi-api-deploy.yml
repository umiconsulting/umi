name: Deploy API to production
'on':
  workflow_call:
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_SSH_PORT:
        required: false
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    if: ${{ vars.UMI_REWARD_RELEASE_HOLD != 'true' }}
    uses: ./.github/workflows/deploy-backend.yml
    with:
      app_name: umi-api
      app_dir: apps/umi-api
      image: ghcr.io/umiconsulting/umi-api
      health_url: https://api.umiconsulting.co/health
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
concurrency:
  group: deploy-api-production
  cancel-in-progress: false
