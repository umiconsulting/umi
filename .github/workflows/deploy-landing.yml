name: deploy landing (cloudflare pages)

on:
  pull_request:
    paths:
      - 'apps/umi-landing-page/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, staging]
    paths:
      - 'apps/umi-landing-page/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile --filter @umi/landing...
      - name: Build static landing
        run: pnpm --filter @umi/landing build
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aef562d6d0c51b70f1b83fa1d2912a4
        working-directory: apps/umi-landing-page
        run: pnpm dlx wrangler@4.129.0 pages deploy out --project-name umi-landing --branch "${{ github.ref_name }}" --commit-dirty=true
