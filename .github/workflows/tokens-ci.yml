name: tokens CI

# packages/tokens commits its generated dist/ (the frontends' Vercel builds run
# app-scoped `npm install` and never execute the monorepo generator). This gate
# proves the committed output still matches source and the parity tests pass, so a
# stale or hand-edited dist/ can't silently drift.
#
# Also runs on pushes to `staging`: a stale dist/ is the kind of drift a merge
# can introduce on the integration branch.
#
# ⚠️ NO `paths:` FILTER — DO NOT ADD ONE. This check is REQUIRED by branch
# protection on `staging`, and GitHub leaves a required-but-skipped check Pending
# forever rather than treating it as passed — so a filter would make every PR that
# misses it UNMERGEABLE, not faster. Unconditional is what makes "required" safe.
# This job runs no install at all and finishes in ~10s; the filter saved nothing
# worth a deadlock.
on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Regenerate dist/ from source
        run: node packages/tokens/build/build.mjs

      - name: dist/ is committed and fresh
        run: git diff --exit-code packages/tokens/dist

      - name: Parity + anti-drift tests
        run: node --test packages/tokens/test/tokens.test.mjs
