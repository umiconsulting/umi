name: Code quality
'on':
  pull_request:
  workflow_call: {}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      # The evidence guard imports @umi/contract. The package exports dist, dist
      # is gitignored, and pnpm install does not build it. Build the runtime here
      # so a cold checkout has the entry before evidence:check:ci runs.
      - name: Build contract runtime
        run: pnpm --filter @umi/contract build:runtime
      # Re-executes the approved evidence checks in this checkout. It does not
      # read an uploaded exit code, so a packet from a developer machine cannot
      # stand in for a result observed here.
      - name: Evidence gate
        run: pnpm evidence:check:ci
      - name: Lint
        run: pnpm lint
      - name: Lint warning baseline
        if: '!cancelled()'
        run: pnpm check:lint-warnings
      - name: Format check
        if: '!cancelled()'
        run: pnpm format:check
      - name: Release identity regression
        run: pnpm ci:release
      - name: Shell commands
        run: shellcheck db/check.sh db/test/migrate.sh apps/umi-api/deploy/deploy.sh apps/umi-dashboard/scripts/build-ci.sh
    timeout-minutes: 15
