name: Code quality

'on':
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate workflow syntax and shell scripts
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''
          shellcheck db/check.sh db/test/migrate.sh apps/umi-api/deploy/deploy.sh apps/umi-dashboard/scripts/build-ci.sh

      - name: Scan commits for secrets
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          LOG_OPTS="-n 50"
          if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          fi
          if ! "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$LOG_OPTS" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"; then
            jq -r '.[] | [.RuleID, .File, .StartLine, .Commit, .Fingerprint] | @tsv' "$RUNNER_TEMP/gitleaks.json"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate design tokens
        run: |
          node packages/tokens/build/build.mjs
          git diff --exit-code packages/tokens/dist
          node --test packages/tokens/test/tokens.test.mjs

      - name: Validate shared contract
        run: |
          pnpm --filter @umi/contract typecheck
          pnpm --filter @umi/contract generate:check
          packages/contract/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext packages/contract/generated/typescript/umi_contract.ts
          pnpm --filter @umi/contract build
          pnpm --filter @umi/contract test

      - name: Lint workspace
        run: pnpm lint

      - name: Lint warning baseline
        if: '!cancelled()'
        run: pnpm check:lint-warnings

      - name: Format check
        if: '!cancelled()'
        run: pnpm format:check

      - name: Release identity and PR integrity checks
        if: '!cancelled()'
        env:
          PR_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          pnpm ci:release
          node scripts/check-pr.mjs
