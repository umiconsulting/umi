# Builds and ships apps/umi-dashboard to Cloudflare Pages with wrangler.
#
# This REPLACES Vercel's Git integration for the dashboard. Vercel may still
# build in parallel until its project is disconnected, but nothing serves from
# Cloudflare on the real domain until the `dashboard` CNAME is cut over in
# Squarespace DNS — so this workflow is safe to land before the cutover.
#
#   push to main     -> production deployment  (umi-dashboard.pages.dev, then the
#                       custom domain once the CNAME points here)
#   push to staging  -> staging project        (staging-dashboard.umiconsulting.co,
#                       built against api-staging.umiconsulting.co)
#   pull_request     -> preview deployment     (pr-<number>.umi-dashboard.pages.dev)
#
# NOTE: GitHub runs the copy of this workflow that lives ON the pushed branch.
#
# The dashboard is a static Vite SPA. Every config value is a VITE_* variable
# baked in AT BUILD TIME — there are no runtime server secrets. The only secret
# this workflow needs is CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
#
# ⚠️ WHY WE WRITE .env.production.local. vite.config.js reads config through
# `loadEnv()`, which reads .env FILES, and then a validator throws if the
# deployed-env keys are missing. In CI there is no .env.local (it is gitignored),
# so we materialise the production values into .env.production.local first. The
# VITE_RELEASE_* values come from the commit, the way Vercel derived them from
# its VERCEL_GIT_* injections. Non-secret build config is inlined below on
# purpose: it is public (an API origin and a version string), and keeping it in
# the workflow makes the deployed configuration reviewable in git.
name: deploy dashboard (cloudflare pages)

on:
  # Manual redeploy of current main (e.g. an env/variable change, no code change).
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'apps/umi-dashboard/**'
      - 'packages/tokens/**'
      - 'packages/contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-dashboard.yml'
  pull_request:
    paths:
      - 'apps/umi-dashboard/**'
      - 'packages/tokens/**'
      - 'packages/contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-dashboard.yml'

# One deploy per ref at a time; a newer push supersedes an in-flight preview.
concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' || vars.UMI_REWARD_RELEASE_HOLD != 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      # Only the dashboard subtree — avoids installing sibling apps (e.g. umi-cash
      # runs `prisma generate` on install, which this build does not need).
      - name: Install
        run: pnpm install --frozen-lockfile --filter @umi/dashboard...

      - name: Write build env
        id: build-config
        run: |
          # The deploy target branch selects the environment. Production (main)
          # calls the API directly — it is already same-site with the dashboard.
          # Every preview (staging and per-PR) instead ships VITE_API_BASE=""
          # so the SPA calls the API SAME-ORIGIN through public/_worker.js; that
          # keeps the session cookie first-party, which Safari iOS ITP requires
          # (…pages.dev and …umiconsulting.co are different sites). The preview
          # backend is chosen at runtime by API_ORIGIN on the selected Pages
          # project and environment. All values here are public build-time config.
          BRANCH="$DEPLOY_BRANCH"
          PROJECT=umi-dashboard
          CONTRACT_VERSION="$(sed -n "s/^export const CONTRACT_VERSION = '\(.*\)';$/\1/p" packages/contract/src/catalog.ts)"
          test -n "$CONTRACT_VERSION" || { echo "CONTRACT_VERSION not found in packages/contract/src/catalog.ts"; exit 1; }
          if [ "$BRANCH" = "main" ]; then
            ENVIRONMENT=production
            API_BASE=https://api.umiconsulting.co
            PUBLIC_URL=https://dashboard.umiconsulting.co
          elif [ "$BRANCH" = "staging" ]; then
            ENVIRONMENT=staging
            API_BASE=
            PROJECT=umi-dashboard-staging
            PUBLIC_URL=https://staging-dashboard.umiconsulting.co
          else
            ENVIRONMENT=staging
            API_BASE=
            PREVIEW_ALIAS=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            PUBLIC_URL="https://$PREVIEW_ALIAS.umi-dashboard.pages.dev"
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "Build env: branch=$BRANCH environment=$ENVIRONMENT api=${API_BASE:-(same-origin)}"
          cat > apps/umi-dashboard/.env.production.local <<EOF
          VITE_UMI_ENVIRONMENT=$ENVIRONMENT
          VITE_AUTH_MODE=cookie
          VITE_API_BASE=$API_BASE
          VITE_PUBLIC_URL=$PUBLIC_URL
          VITE_BUSINESS_SLUG=elgranribera
          VITE_CONTRACT_VERSION=$CONTRACT_VERSION
          # main still uses @supabase/supabase-js for auth + password reset
          # (lib/auth.jsx, screens/reset-password.jsx), so the production client
          # needs these or createClient() throws "supabaseUrl is required" at load
          # and the app white-screens. The anon key is a public client key, but it
          # is a JWT, so it lives in an Actions variable to keep gitleaks quiet.
          # Remove these when the dashboard no longer uses Supabase.
          # They are written on every branch so a preview cannot white-screen
          # either; only the production origin is used by the main build.
          VITE_SUPABASE_URL=https://xbudknbimkgjjgohnjgp.supabase.co
          VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CONFIG_SCHEMA_VERSION=1
          VITE_RELEASE_VERSION=${{ github.ref_name }}
          VITE_RELEASE_GIT_COMMIT=${{ github.sha }}
          VITE_RELEASE_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Build
        run: pnpm --filter @umi/dashboard build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aef562d6d0c51b70f1b83fa1d2912a4
          PAGES_PROJECT: ${{ steps.build-config.outputs.project }}
          PUBLIC_URL: ${{ steps.build-config.outputs.public_url }}
        run: |
          # Each stable branch has its own project. PRs preview on umi-dashboard.
          BRANCH="$DEPLOY_BRANCH"
          echo "Deploying to Cloudflare Pages (branch: $BRANCH)"
          OUT=$(pnpm dlx wrangler@4.129.0 pages deploy apps/umi-dashboard/dist \
            --project-name="$PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true 2>&1)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          {
            echo "### Cloudflare Pages — $PAGES_PROJECT"
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- public URL: $PUBLIC_URL"
            echo "- deployment: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
