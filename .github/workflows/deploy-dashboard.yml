name: Deploy dashboard
'on':
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-dashboard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
      - name: Download the validated build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dashboard-static
          path: apps/umi-dashboard/dist
      - name: Deploy the validated build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8aef562d6d0c51b70f1b83fa1d2912a4
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pnpm dlx wrangler@4.129.0 pages deploy apps/umi-dashboard/dist --project-name=umi-dashboard --branch="$DEPLOY_BRANCH" --commit-dirty=true
