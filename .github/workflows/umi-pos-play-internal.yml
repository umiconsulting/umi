name: umi-pos · Google Play internal

on:
  pull_request:
    paths:
      - .github/workflows/umi-pos-play-internal.yml
      - scripts/build-umipos-android-release*
  workflow_dispatch:
    inputs:
      version:
        description: Display version (major.minor.patch)
        required: true
        default: 0.1.0
        type: string
      build_number:
        description: New versionCode (1–2100000000; never reuse an uploaded code)
        required: true
        type: string
      publish:
        description: Upload to Google Play internal (requires first Console upload)
        default: false
        type: boolean
      release_notes:
        description: Release notes in Spanish (up to 500 characters)
        required: true
        default: Primera versión de UmiPOS para pruebas internas. Incluye pedidos, ventas y control de caja.
        type: string

permissions:
  contents: read

concurrency:
  group: umipos-play-${{ github.event_name == 'pull_request' && github.ref || 'internal' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/build-umipos-android-release.test.mjs
      - run: shellcheck scripts/build-umipos-android-release.sh

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Check release inputs
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Publish releases from main.'
            exit 1
          fi
          if (( ${#RELEASE_NOTES} > 500 )); then
            echo '::error::Release notes must contain at most 500 characters.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/play-notes"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/play-notes/whatsnew-es-419"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install bundletool 1.18.3
        run: |
          curl --fail --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  %s\n' \
            "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Restore the upload key
        env:
          KEYSTORE_B64: ${{ secrets.UMIPOS_ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo '::error::Set UMIPOS_ANDROID_KEYSTORE_B64 before this build.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/umipos-upload.jks"
      - name: Build and verify the signed production bundle
        env:
          UMIPOS_RELEASE_VERSION: ${{ inputs.version }}
          UMIPOS_BUILD_NUMBER: ${{ inputs.build_number }}
          UMIPOS_ANDROID_ARTIFACT_FORMAT: appbundle
          UMIPOS_ANDROID_APP_ID: co.umiconsulting.umi_pos
          UMIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/umipos-upload.jks
          UMIPOS_ANDROID_KEY_ALIAS: umi-pos-release
          UMIPOS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UMIPOS_ANDROID_KEYSTORE_PASSWORD }}
          UMIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.UMIPOS_ANDROID_KEY_PASSWORD }}
          UMIPOS_ARTIFACT_PATH: ${{ runner.temp }}/UmiPOS.aab
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          UMIPOS_CONTRACT_VERSION="$(node -p "require('./packages/contract/generated/contract.json').contractVersion")"
          export FLUTTER_BIN UMIPOS_CONTRACT_VERSION
          bash scripts/build-umipos-android-release.sh
          cd "$RUNNER_TEMP"
          sha256sum UmiPOS.aab > UmiPOS.aab.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umipos-play-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/UmiPOS.aab
            ${{ runner.temp }}/UmiPOS.aab.sha256
            ${{ runner.temp }}/play-notes/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/umipos-upload.jks"

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Google Play configuration
        env:
          WIF_PROVIDER: ${{ vars.UMIPOS_PLAY_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.UMIPOS_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$WIF_PROVIDER" || -z "$SERVICE_ACCOUNT" ]]; then
            echo '::error::Set UMIPOS_PLAY_WIF_PROVIDER and UMIPOS_PLAY_SERVICE_ACCOUNT. See docs/development/UMIPOS_GOOGLE_PLAY_RELEASE.md.'
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: umipos-play-${{ inputs.build_number }}
          path: ${{ runner.temp }}/play-release
      - name: Verify the artifact digest
        working-directory: ${{ runner.temp }}/play-release
        run: sha256sum --check UmiPOS.aab.sha256
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.UMIPOS_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.UMIPOS_PLAY_SERVICE_ACCOUNT }}
      - name: Release to internal testers
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: co.umiconsulting.umi_pos
          releaseFiles: ${{ runner.temp }}/play-release/UmiPOS.aab
          track: internal
          status: completed
          releaseName: UmiPOS ${{ inputs.version }} (${{ inputs.build_number }})
          whatsNewDirectory: ${{ runner.temp }}/play-release/play-notes
